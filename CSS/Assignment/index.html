<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Template</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="child1">
            <img src="google.png" width="40px"
            height="40px">
            <div class="box">
                <div class="box1">
                    <p class="p1">Create a Google Account</p>
                    <p class="p2"> Enter Your Name</p>
                </div>
                <div class="box2">
                    <input type="text" placeholder="First Name">
                    <input type="text" placeholder="Last Name(Optional)">
                    <button type="submit" class="next"> Next </button>
                </div>
            </div>
        </div>
        <div class="child2">
            <select class="Language">
                <option value="English" active> English (United States)</option>
                <option value="urdu">اردو</option>
                <option value="Arabic">العربیہ</option>
            </select>
            <p>
                <span> Help </span>
                <span> Privacy </span>
                <span> Terms </span>
            </p>
        </div>
    </div>
    
</body>
</html>
