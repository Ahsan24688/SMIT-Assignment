<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Login Page </title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
</head>

<body>
    <h1> Login Here </h1>
    <div class="container">
        <form id="loginForm">
            <label for="email">Email:</label>
            <input type="email" id="Lnemail" name="Lnemail" placeholder="Enter Your Email"><br><br>

            <label for="password">Password:</label>
            <input type="password" id="Lnpass" name="Lnpass" placeholder="Enter Your Password"><br><br>

            <input type="submit" value="Login" class="btn">
            <p style="color: black"> Don't Have an Account, please Click to <a href="./register.html">Register Here</a>
            </p>
        </form>
    </div>

    <div id="modal_container" class = "animate__animated animate__zoomIn">
        <div class="modal_boxx">
            <div class="mbox">
                <h2>❌Error</h2>
                <p id="Message"></p>
                <button id="close">Close</button>
            </div>
        </div>
    </div>

    <script type="module" src="login.js"></script>
</body>

</html>
