<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet"href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=menu" />
</head>

<body>
    <div class="container">
        <nav>
            <h1 id="heading"> Dashboard </h1>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Contact Us</li>
            </ul>
            <div class="btndiv">
                <button id="logout"> Logout </button>
                <button id="delete"> Delete Account </button>
            </div>
        </nav>
        <div id="render"></div>
    </div>
    <div class="post-container">
        <p class="post-text"> Post Your Story Here </p>
        <button id="postbtn"> Create Post </button>

        <div class="postmodal  animate__animated animate__zoomIn" id="postmodal">
            <div class="postbox">
                <h1> Create Post</h1>
                <input type="text" placeholder="Enter Title" id="title">
                <textarea name="story" id="story" cols="30" rows="10" placeholder="Enter Your Story"></textarea>
                <button id="save"> save </button>
                <button id="update"> Update </button>
                <button id="close"> close </button>
            </div>
        </div>
        <div id="renderposts">No Posts....</div>
    </div>

    <script type="module" src="Dashboard.js"></script>
</body>

</html>
