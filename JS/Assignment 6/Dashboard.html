<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Posting Website</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
</head>

<body>
    <div class="page-shell">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark">P</span>
                <div>
                    <h1 id="heading">Dashboard</h1>
                    <p>Manage your stories and posts</p>
                </div>
            </div>
            <div class="btndiv">
                <button id="logout" class="btn btn-secondary">Logout</button>
                <button id="delete" class="btn btn-danger">Delete Account</button>
            </div>
        </header>

        <main class="dashboard-main">
            <section class="welcome-card">
                <div class="welcome-content">
                    <div id="render"></div>
                    <p>Share your ideas, keep your thoughts organized, and grow your audience from one beautiful workspace.</p>
                </div>
                <button id="postbtn" class="btn btn-primary">Create Post</button>
            </section>

            <section class="posts-section">
                <div class="section-header">
                    <div>
                        <h2>Your Posts</h2>
                        <p>Latest updates appear first</p>
                    </div>
                </div>
                <div id="renderposts">No Posts....</div>
            </section>
        </main>
    </div>

    <div class="postmodal animate__animated animate__zoomIn" id="postmodal">
        <div class="postbox">
            <div class="postbox-header">
                <h2>Create Post</h2>
                <button id="close" class="icon-btn">✕</button>
            </div>
            <label for="title">Post Title</label>
            <input type="text" placeholder="Enter Title" id="title">
            <label for="story">Your Story</label>
            <textarea name="story" id="story" cols="30" rows="10" placeholder="Enter Your Story"></textarea>
            <div class="modal-actions">
                <button id="save" class="btn btn-primary">Save</button>
                <button id="update" class="btn btn-secondary">Update</button>
            </div>
        </div>
    </div>

    <script type="module" src="Dashboard.js"></script>
</body>

</html>
