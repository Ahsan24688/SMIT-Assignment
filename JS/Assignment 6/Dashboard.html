<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>
    <div class="container">
        <nav>
            <h1> Dashboard </h1>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Contact Us</li>
            </ul>
            <div class="btndiv">
            <button id="logout"> Logout </button>
            <button id="delete"> Delete Account </button>
            </div>
        </nav>
        <div id="render"></div>
    </div>
    <div class="post">
        <p> Post Your Story Here </p>
        <button id="postbtn"> Create Post </button>

        <div class="postmodal" id="postmodal">
            <div class="postbox">
                <h1> Create Post</h1>
                <input type="text" placeholder="Enter Title" id="title">
                <textarea name="story" id="story" cols="30" rows="10" placeholder="Enter Your Story"></textarea>
                <button id="save"> save </button>
                <button id="close"> close </button>
            </div>
        </div>
        <div id="renderposts">No Posts....</div>
    </div>

    <script type="module" src="Dashboard.js"></script>
</body>

</html>
