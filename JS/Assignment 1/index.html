<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="1.webp">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=backspace" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&" />
    <title> Calculator </title>
</head>

<body>
    <div class="container_box">
        <div id="gui">
            <div class="icon1">
                <p id="time"></p>
                <div>
                    <span class="material-symbols-outlined">android_cell_4_bar</span>
                    <span class="material-symbols-outlined">wifi</span>
                    <span class="material-symbols-outlined">battery_android_frame_4</span>
                </div>
            </div>
            <div class="icon2">
                <span class="material-symbols-outlined">menu</span>
                <span class="material-symbols-outlined">function</span>
            </div>
            <div id="input"></div>
            <div id="output"></div>
            <div class="main_btn">
                <button id="historyDiv" onClick="toseemyhistory()"> See History </button>
                <button onClick="clearhistory()"> Clear History </button>
            </div>
        </div>


        <div class="btns_func">
            <div class="btn btnn" onClick="Enterdata('backspace')"><span
                    class="material-symbols-outlined">backspace</span></div>
            <div class="btn btnn" onClick="Enterdata('clear')">AC</div>
            <div class="btn btnn" onClick="Enterdata('%')">%</div>
            <div class="btn btn2" onClick="Enterdata('/')">/</div>
            <div class="btn" onClick="Enterdata(7)">7</div>
            <div class="btn" onClick="Enterdata(8)">8</div>
            <div class="btn" onClick="Enterdata(9)">9</div>
            <div class="btn btn2" onClick="Enterdata('*')">x</div>
            <div class="btn" onClick="Enterdata(4)">4</div>
            <div class="btn" onClick="Enterdata(5)">5</div>
            <div class="btn" onClick="Enterdata(6)">6</div>
            <div class="btn btn2" onClick="Enterdata('-')">-</div>
            <div class="btn" onClick="Enterdata(1)">1</div>
            <div class="btn" onClick="Enterdata(2)">2</div>
            <div class="btn" onClick="Enterdata(3)">3</div>
            <div class="btn btn2" onClick="Enterdata('+')">+</div>
            <div class="div17 btn" onClick="Enterdata(0)">0</div>
            <div class="div18 btn" onClick="Enterdata('.')">.</div>
            <div class="div19 btn btn2" onClick="calculator()">=</div>
        </div>

    </div>

    <script src="Calculator.js"></script>
</body>

</html>
