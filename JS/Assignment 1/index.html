<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=backspace" />
    <title> Calculator </title>
</head>

<body>
    <div class="container_box">
        <div id="gui">
            <p id="input"></p>
            <p id="output"></p>
        </div>

        
<div class="parent">
    <div class="btn btnn" onClick="Enterdata('backspace')"><span class="material-symbols-outlined">backspace</span></div>
    <div class="btn btnn" onClick="Enterdata('clear')">AC</div>
    <div class="btn btnn" onClick="Enterdata('%')">%</div>
    <div class="btn btn2" onClick="Enterdata('/')">/</div>
    <div class="btn" onClick="Enterdata(7)">7</div>
    <div class="btn" onClick="Enterdata(8)">8</div>
    <div class="btn" onClick="Enterdata(9)">9</div>
    <div class="btn btn2" onClick="Enterdata('*')">x</div>
    <div class="btn" onClick="Enterdata(4)">4</div>
    <div class="btn" onClick="Enterdata(5)">5</div>
    <div class="btn" onClick="Enterdata(6)">6</div>
    <div class="btn btn2" onClick="Enterdata('-')">-</div>
    <div class="btn" onClick="Enterdata(1)">1</div>
    <div class="btn" onClick="Enterdata(2)">2</div>
    <div class="btn" onClick="Enterdata(3)">3</div>
    <div class="btn btn2" onClick="Enterdata('+')">+</div>
    <div class="div17 btn" onClick="Enterdata(0)">0</div>
    <div class="div18 btn" onClick="Enterdata('.')">.</div>
    <div class="div19 btn btn2" onClick="calculator()">=</div>
</div>
    
    </div>

    <script src="Calculator.js"></script>
</body>

</html>
